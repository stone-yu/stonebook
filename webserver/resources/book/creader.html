<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>{{ book.title }}</title>

  <base href="{{RES}}/static/candle-reader/" />

  <link rel="icon" href="{{RES}}/logo/favicon.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="anonymous">
  <link rel="preload" as="style" onload="this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap">
  <link rel="stylesheet" crossorigin href="style.css?v=v1.2.0">
  <link rel="stylesheet" href="../annotations/talebook-annotations.css?v=20260817-click">

  <script src="js/epub-v0.3.88.js"></script>
  <script  type="module">
    import { Reader } from "./candle-reader.es.js?v=v1.2.0"
    import { TalebookAnnotations, annotationSearchQueries } from "../annotations/talebook-annotations.js?v=20260817-click"

    function startReader() {
      document.getElementById('converting').style.display = 'none'
      const reader = new Reader('#app', {
        debug: false,
        server: "{{CANDLE_READER_SERVER}}",
        themes_css: "{{RES}}/static/candle-reader/css/themes.css?v=v1.2.0",
        book_url: "{{RES}}{{epub_dir}}/",
        display_url: "",
        book_id: {{book.id}},
        audiobook_edition_id: {% if audiobook_edition_id %}{{audiobook_edition_id}}{% else %}null{% endif %},
        audiobook_manifest_url: {% if audiobook_edition_id %}"{{RES}}/api/audio/{{audiobook_edition_id}}"{% else %}""{% endif %},
      })
      const epubInstance = () => reader.reader && reader.reader()
      const frameSelection = () => {
        const instance = epubInstance()
        const location = instance && instance.selected_location
        if (!location) return null
        const selection = location.contents.window.getSelection()
        const quote = selection ? selection.toString().trim() : ''
        const bodyText = location.contents.document.body.innerText || ''
        const offset = bodyText.indexOf(quote)
        return {
          quote,
          prefix: offset >= 0 ? bodyText.slice(Math.max(0, offset - 120), offset) : '',
          suffix: offset >= 0 ? bodyText.slice(offset + quote.length, offset + quote.length + 120) : '',
          chapter: location.toc && (location.toc.label || location.toc.name) || '',
          locator: {
            cfi: String(location.range_cfi || location.cfi),
            segment_id: location.segment_id,
          },
        }
      }
      const currentLocation = () => {
        const instance = epubInstance()
        const location = instance && instance.selected_location
        const renditionLocation = instance && instance.rendition && instance.rendition.currentLocation()
        const cfi = location ? String(location.cfi) : renditionLocation && renditionLocation.start && renditionLocation.start.cfi
        const chapter = location && location.toc ? (location.toc.label || location.toc.name) : instance && instance.current_toc && (instance.current_toc.label || instance.current_toc.name)
        return cfi ? { chapter: chapter || '', locator: { cfi } } : null
      }
      const locate = async annotation => {
        const instance = epubInstance()
        if (!instance || !instance.rendition) return 'failed'
        const cfi = annotation.locator && annotation.locator.cfi
        if (annotation.format === 'epub' && cfi) {
          try {
            await instance.rendition.display(cfi)
            if (annotation.quote) instance.rendition.annotations.highlight(cfi, {}, null, '', { fill: annotation.color || '#f6c85f', 'fill-opacity': '0.35' })
            return 'exact'
          } catch (error) {
            console.debug('EPUB CFI location failed, falling back to text search', error)
          }
        }
        const queries = annotationSearchQueries(annotation)
        if (!queries.length || !instance.book || !instance.book.spine) return 'failed'
        let best = null
        for (const section of instance.book.spine.spineItems || []) {
          try {
            await section.load(instance.book.load.bind(instance.book))
            for (let rank = 0; rank < queries.length; rank += 1) {
              if (best && rank >= best.rank) break
              const match = section.search(queries[rank])[0]
              if (match) best = { cfi: match.cfi, rank }
            }
          } catch (error) {
            console.debug('EPUB annotation text search skipped a section', error)
          } finally {
            section.unload()
          }
          if (best && best.rank === 0) break
        }
        if (!best) return 'failed'
        try {
          await instance.rendition.display(best.cfi)
          instance.rendition.annotations.highlight(best.cfi, {}, null, '', { fill: annotation.color || '#f6c85f', 'fill-opacity': '0.35' })
          return 'approximate'
        } catch (error) {
          console.debug('EPUB annotation fallback location failed', error)
          return 'failed'
        }
      }
      let annotationItems = []
      let annotationSdk = null
      const bindContentAnnotations = () => {
        const instance = epubInstance()
        if (!instance || !annotationSdk) return
        ;(instance.rendition.getContents() || []).forEach(contents => {
          const frame = contents.document && contents.document.defaultView && contents.document.defaultView.frameElement
          annotationItems.filter(item => item.kind === 'note' && item.content).forEach(item => {
            contents.document.querySelectorAll(`.ta-note-${item.id}`).forEach(target => annotationSdk.bindAnnotationTarget(target, item, frame))
          })
          if (!contents.document.documentElement.dataset.taSelectionBound) {
            contents.document.documentElement.dataset.taSelectionBound = '1'
            contents.document.addEventListener('selectionchange', () => {
              const selection = contents.document.getSelection()
              if (!selection || selection.isCollapsed) window.dispatchEvent(new CustomEvent('talebook-reader-selection-cleared'))
            })
          }
        })
      }
      annotationSdk = new TalebookAnnotations({
        bookId: {{book.id}},
        format: 'epub',
        getSelection: frameSelection,
        getLocation: currentLocation,
        locate,
        onAnnotations: items => {
          annotationItems = items
          const instance = epubInstance()
          if (!instance || !instance.rendition) return
          items.filter(item => item.quote && item.locator && item.locator.cfi).forEach(item => {
            const isThought = item.kind === 'note' && item.content
            if (!isThought && item.kind !== 'highlight') return
            try {
              instance.rendition.annotations.highlight(item.locator.cfi, { annotationId: item.id }, () => isThought ? annotationSdk.editAnnotation(item) : annotationSdk.openAnnotation(item), isThought ? `ta-note-${item.id}` : '', { fill: item.color, 'fill-opacity': isThought ? '0.22' : '0.35' })
            } catch (error) { console.debug(error) }
          })
          window.setTimeout(bindContentAnnotations, 0)
        },
      })
      const instance = epubInstance()
      if (instance && instance.rendition) {
        instance.rendition.on('rendered', () => window.setTimeout(bindContentAnnotations, 0))
        instance.rendition.on('markClicked', (cfiRange, data) => {
          const item = annotationItems.find(row => row.id === Number(data && data.annotationId))
          if (item) item.kind === 'note' && item.content ? annotationSdk.editAnnotation(item) : annotationSdk.openAnnotation(item)
        })
      }
    }

    {% if is_ready %}
    startReader()
    {% else %}
    // 本书无EPUB格式，服务器正在后台转换；轮询等待EPUB就绪后再初始化阅读器，
    // 避免阅读器在转换完成前请求书籍文件而报"加载超时"
    document.getElementById('converting').style.display = 'flex'
    let retries = 180
    function waitReady() {
      fetch("{{RES}}{{epub_dir}}/META-INF/container.xml?t=" + Date.now())
        .then(function(rsp) {
          if (rsp.ok) {
            startReader()
            return
          }
          retry()
        })
        .catch(retry)
    }
    function retry() {
      retries -= 1
      if (retries <= 0) {
        document.getElementById('converting-msg').textContent = "转换超时，请刷新页面重试，或联系管理员查看转换日志"
        return
      }
      setTimeout(waitReady, 2000)
    }
    waitReady()
    {% endif %}
  </script>
  <style>
    #converting {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #333;
      font-family: Roboto, sans-serif;
      text-align: center;
      padding: 0 24px;
    }
    #converting .spinner {
      width: 40px;
      height: 40px;
      margin-bottom: 24px;
      border: 4px solid #ddd;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: converting-spin 1s linear infinite;
    }
    @keyframes converting-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="converting">
    <div class="spinner"></div>
    <h3>{{ book.title }}</h3>
    <p id="converting-msg">首次在线阅读，服务器正在将本书转换为 EPUB 格式，<br>预计需要 1~2 分钟，请耐心等待，转换完成后将自动打开。</p>
  </div>
</body>
</html>
