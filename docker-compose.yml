version: "2.4"

services:

  # main service
  talebook:
    restart: always
    image: talebook/talebook
    volumes:
      # 应用状态、扫描来源、Calibre 书库和有声书资产使用独立持久化目录。
      - "${TALEBOOK_DATA_DIR:-./data}:/data"
      - "${TALEBOOK_IMPORTS_DIR:-./imports}:/imports"
      - "${TALEBOOK_LIBRARY_DIR:-./library}:/library"
      - "${TALEBOOK_AUDIOBOOKS_DIR:-./audiobooks}:/audiobooks"
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      # 如果需要上传ssl证书，请将PUID与PGID设置为0（root用户）
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    depends_on:
      - douban-rs-api

  # optional, for meta plugins
  # please set "http://douban-rs-api" in settings
  douban-rs-api:
    restart: always
    image: ghcr.io/cxfksword/douban-api-rs
